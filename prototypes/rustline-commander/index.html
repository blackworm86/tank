<!-- Question: guidare il carro, anticipare la torretta lenta e dirigere squadre fragili entro il raggio radio su un terreno che si sbriciola è divertente per un run da 15-20 minuti? -->
<!-- Date: 2026-11-25 -->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rustline Commander</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a120d; overflow: hidden; cursor: none; }
  canvas { cursor: none; }
  body { font-variant-numeric: tabular-nums; }
  canvas { display: block; position: absolute; left: 0; top: 0; }
  #game { z-index: 2; }
  #gl { z-index: 1; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script src="vendor/three.js"></script>
<script src="config.js"></script>
<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/biomes.js"></script>
<script src="js/structs.js"></script>
<script src="js/view.js"></script>
<script src="js/terrain.js"></script>
<script src="js/systems/units.js"></script>
<script src="js/systems/vehicle.js"></script>
<script src="js/systems/entities.js"></script>
<script src="js/systems/run.js"></script>
<script src="js/systems/squads.js"></script>
<script src="js/systems/ride.js"></script>
<script src="js/systems/fog.js"></script>
<script src="js/systems/ordermenu.js"></script>
<script src="js/systems/play.js"></script>
<script src="js/systems/tank.js"></script>
<script src="js/systems/unitstep.js"></script>
<script src="js/systems/combat.js"></script>
<script src="js/systems/economy.js"></script>
<script src="js/systems/workshop.js"></script>
<script src="js/systems/barracks.js"></script>
<script src="js/systems/sound.js"></script>
<script src="js/systems/dev.js"></script>
<script src="js/systems/horde.js"></script>
<script src="js/tactics.js"></script>
<script src="js/hud.js"></script>
<script src="js/campaign.js"></script>
<script src="js/factions.js"></script>
<script src="js/loadout.js"></script>
<script src="js/modules.js"></script>
<!-- Content packs: a pack is a folder in js/content/ and its lines here, after every system; an expansion
     is one more folder and its lines below base (docs/architecture/rustline-modular-plan.md). -->
<!-- pack: base -->
<script src="js/content/base/raiders.js"></script>
<script src="js/content/base/enemies.js"></script>
<script src="js/content/base/missions.js"></script>
<script src="js/content/base/lands.js"></script>
<script src="js/content/base/modules.js"></script>
<script src="js/content/base/arsenal.js"></script>
<script src="js/content/base/testmap.js"></script>
<script>
'use strict';
// The one-shot's starter: only what the checks read. Keep the fixed step, the clock hook,
// window.game and the play and figures scenes. Everything else is the game's own.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 1280, H = 720;        // logical size
const PIXEL = false;
const FONT = '"Trebuchet MS", "Segoe UI", sans-serif';
const TITLE = 'Rustline Commander';
const CONTROLS = [
  'W/S avanti e indietro   A/D ruota lo scafo',
  'Mouse: punta (la torretta segue lenta)',
  'Click sx: arma principale   Click dx: coassiale',
  'X: colpo HE / AP / FRAG   1-5: sistemi attivi',
  'Spazio o Tab: pausa tattica: lì si danno gli ordini',
  'In pausa: WASD vista, click dx menu ordini',
  'V vai  F attacca/assalto  C al riparo  R agguato',
  'Shift+click dx: tappa   trascina: direzione',
  '1-6 squadre  Alt+1-6 forma  G seguimi  Z fermi  B a bordo',
  'All\'uscita: officina (modifiche, colpi, riparazioni, soldati)',
  'Q/E camera  Rotella zoom  P pausa  M muto  F2 sviluppo',
];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap'; // a headless shot or check: 3D draws cheap; players never see it
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fit() { // fills the window at any size and pixel ratio
  const s = Math.min(innerWidth / W, innerHeight / H);
  const r = s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.left = Math.max(0, Math.floor((innerWidth - W * s) / 2)) + 'px';
  canvas.style.top = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = true;
  if (typeof fitGL === 'function') fitGL();
}
addEventListener('resize', fit); fit();
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center') {
  ctx.fillStyle = c; ctx.font = `${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
addEventListener('keydown', e => {
  startAudio();
  if (state && state.rename) { // typing a squad's name: Enter keeps it, Esc drops it
    e.preventDefault(); const r = state.rename;
    if (e.key === 'Enter') { const t = r.text.trim(); if (t) { r.sq.name = t.slice(0, 18); r.sq.named = true; } state.rename = null; }
    else if (e.key === 'Escape') state.rename = null;
    else if (e.key === 'Backspace') r.text = r.text.slice(0, -1);
    else if (e.key.length === 1 && r.text.length < 18) r.text += e.key;
    return;
  }
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code === 'Tab' || e.code === 'F2' || e.code === 'F1' || e.code.startsWith('Arrow') || e.altKey) e.preventDefault(); // Alt+1-6 is the game's
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('pointerdown', () => startAudio());
addEventListener('blur', () => { down.clear(); MS.l = MS.r = false; });
// the mouse, in logical screen coordinates
const MS = { x: W / 2, y: H / 2 - 60, l: false, r: false, lp: false, rp: false, lr: false, rr: false, drag: null, wheel: 0 };
function mousePos(e) { const b = canvas.getBoundingClientRect(); MS.x = (e.clientX - b.left) / b.width * W; MS.y = (e.clientY - b.top) / b.height * H; }
addEventListener('mousemove', mousePos);
addEventListener('mousedown', e => { mousePos(e); if (e.button === 0) { MS.l = true; MS.lp = true; } if (e.button === 2) { MS.r = true; MS.rp = true; } });
addEventListener('mouseup', e => { if (e.button === 0) { MS.l = false; MS.lr = true; } if (e.button === 2) { MS.r = false; MS.rr = true; } });
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('wheel', e => { MS.wheel += Math.sign(e.deltaY); e.preventDefault(); }, { passive: false });

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); // a check may inject one
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted)); // the tweak panel (an add-on), when added, moved a value: the volume follows
function tone(freq, dur, type = 'square', vol = 0.3) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}

// ---- Scenes -------------------------------------------------------------------------------
let scene, state, runNo = 0, campSeed = 0;
function reset() {
  // a fixed seed (the address, config, or a headless check) replays the same campaigns; otherwise each one is new
  const fixed = Number(params.get('seed')) || CONFIG.seed || (window.GAME_CLOCK || CHEAP ? 1 : 0);
  campSeed = fixed ? fixed + runNo * 7919 : 1 + (Date.now() + runNo * 7919) % 999983; runNo++;
  seed = campSeed;
  // state.gained: what this run gained or learned, the high the ending shows.
  state = { t: 0, score: 0, gained: '' };
  newCampaign(); startNode(campNode(0), null); state.goScene = null;
}
/** A new run with the same hull, straight into its first sector. */
function restartRun() { reset(); scene = 'play'; }
/** The test map (js/content/base/testmap.js): no enemies, every kind of ground, a few squads. */
function goTest() { startTestMap(); scene = 'play'; }
/** Back to the title screen (a fresh map behind it), where the hull is picked. */
function goTitle() { reset(); scene = 'title'; }
/** The end screens: R or Enter for a new run, Esc for the title, or their buttons. */
function endKeys() {
  if (pressed('KeyR') || pressed('Enter') || pressed('NumpadEnter')) restartRun();
  else if (pressed('Escape')) goTitle();
  else clickButtons();
  MS.lp = MS.rp = MS.lr = MS.rr = false;
}
function follow() { const g = state.goScene; if (g) { state.goScene = null; scene = g; } }
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() { ctx.clearRect(0, 0, W, H); const labels = renderFigures(); drawFiguresLabels(labels); },
  },
  title: {
    update(dt) {
      state.t += dt;
      cam.yawT += dt * 0.08; cam.yaw = cam.yawT; cam.dist = 95;
      const s = state.tank; cam.x = s.x; cam.z = s.z; cam.y = s.y;
      // the hull for the run: click a card, or the arrows
      if (pressed('ArrowRight') || pressed('ArrowLeft')) { const U = HULL_IDS.filter(h => meta.unlocked.includes(h)), i = Math.max(0, U.indexOf(HULL_PICK.id)); HULL_PICK.id = U[(i + (pressed('ArrowRight') ? 1 : U.length - 1)) % U.length]; }
      clickButtons();
      if (pressed('Enter') || pressed('Space') || pressed('NumpadEnter')) { reset(); scene = 'play'; }
      else if (pressed('KeyT')) goTest();
      MS.lp = MS.rp = MS.lr = MS.rr = false;
    },
    draw() { ctx.clearRect(0, 0, W, H); renderWorld(); drawTitle(); },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || (pressed('Escape') && !state.menu)) { scene = 'pause'; return; }
      try { stepPlay(dt); } catch (err) { reportError(err); }
      // the run ends even if something above went wrong: a lost tank always reaches the end screen
      if (!state.tank.alive && !state.goScene && state.t > (state.tank.deathT || 0) + 5) { state.result = state.result || 'lose'; endRun(); }
      state.score = state.kills;
      follow();
    },
    draw() { ctx.clearRect(0, 0, W, H); renderWorld(); drawHUD(); drawMapHUD(); drawMenu(); drawCursor(); },
  },
  // the campaign map between two sectors
  campaign: {
    update() { campaignInput(); MS.lp = MS.rp = MS.lr = MS.rr = false; follow(); },
    draw() { ctx.clearRect(0, 0, W, H); renderWorld(); drawCampaign(); },
  },
  // someone met on the way: a few lines and a choice
  event: {
    update() { eventInput(); MS.lp = MS.rp = MS.lr = MS.rr = false; follow(); },
    draw() { ctx.clearRect(0, 0, W, H); renderWorld(); drawHUD(); drawEvent(); },
  },
  shop: {
    update() { workshopInput(); }, // js/systems/workshop.js
    draw() {
      if (!state.shopSite) { state.shopSite = world.sites.start; state.shopTab = shopTabs()[Number(params.get('tab')) || 0]; } // a shot opens it straight
      ctx.clearRect(0, 0, W, H); renderWorld(); drawShop();
    },
  },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape')) scene = 'play'; MS.lp = MS.rp = MS.lr = MS.rr = false; },
    draw() {
      scenes.play.draw(); ctx.fillStyle = 'rgba(14,10,8,0.55)'; ctx.fillRect(0, 0, W, H);
      text('Pausa', W / 2, H / 2 - 20, 52, '#fff2d8'); text('P o Esc per riprendere', W / 2, H / 2 + 30, 20, '#e8dcc8');
    },
  },
  over: {
    update() { endKeys(); },
    draw() { ctx.clearRect(0, 0, W, H); renderWorld(); drawEnd(false); },
  },
  results: {
    update() { endKeys(); },
    draw() { ctx.clearRect(0, 0, W, H); renderWorld(); drawEnd(true); },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
/** An error in one step or frame is logged and the game goes on: the loop never stops. */
function reportError(err) { console.error(err); }
function step() {
  try {
    if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
    const was = scene;
    scenes[scene].update(STEP);
    if (scene === 'play' && was !== 'play' && state) state.menuBlock = true; // a click that closed a dialogue or a menu never fires the gun (cleared on release)
  } catch (err) { reportError(err); }
  hit.clear();
  canvas.style.cursor = 'none'; // only the game's own cursor shows
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
/** The game's pointer outside play (play draws its own crosshair or command arrow). */
function drawPointer() {
  ctx.fillStyle = '#ffe6a0'; ctx.strokeStyle = '#1a120c'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(MS.x, MS.y); ctx.lineTo(MS.x + 13, MS.y + 5); ctx.lineTo(MS.x + 6, MS.y + 7); ctx.lineTo(MS.x + 4, MS.y + 14); ctx.closePath(); ctx.fill(); ctx.stroke();
}
function drawFrame() { try { scenes[scene].draw(); if (scene !== 'play') drawPointer(); } catch (err) { reportError(err); } }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

initView();
reset();
scene = params.get('scene') || 'title';
if (scene === 'test') goTest();
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
</html>
